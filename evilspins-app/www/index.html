<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvilSpins NFC Debug</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 12px;
        }

        /* Top Status Bar - Three indicators */
        .status-panel {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #30363d;
            flex-wrap: wrap;
        }
        .status-item {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px;
            background: #0d1117;
            border-radius: 6px;
            border: 1px solid #21262d;
        }
        .status-label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-value {
            font-size: 15px;
            font-weight: 600;
            color: #c9d1d9;
            word-break: break-word;
            white-space: pre-wrap;
            font-family: inherit;
        }
        .status-value.active { color: #3fb950; }
        .status-value.empty { color: #8b949e; font-style: italic; }
        .status-value.denied { color: #f85149; }
        .status-value.granted { color: #3fb950; }

        /* Middle Action Buttons */
        .action-panel {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .action-btn {
            flex: 1;
            padding: 14px 24px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #21262d;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn:hover { background: #30363d; border-color: #484f58; }
        .action-btn:active { background: #161b22; }
        .action-btn.create { border-color: #3fb950; }
        .action-btn.create:hover { background: #1a3a2a; }
        .action-btn.delete { border-color: #f85149; }
        .action-btn.delete:hover { background: #3a1a1a; }

        /* Bottom Logs */
        .log-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #30363d;
            overflow: hidden;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
        }
        .log-title {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .log-controls {
            display: flex;
            gap: 8px;
        }
        .log-btn {
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            background: #21262d;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }
        .log-btn:hover { background: #30363d; }
        .log-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-size: 11px;
            line-height: 1.6;
        }
        .log-entry {
            margin: 2px 0;
            padding: 4px 8px;
            border-radius: 3px;
            word-break: break-word;
            white-space: pre-wrap;
            font-family: inherit;
        }
        .log-nfc { background: #1a3a2a; border-left: 3px solid #3fb950; color: #7ee787; }
        .log-lux { background: #1a3a1a; border-left: 3px solid #d29922; color: #e3b341; }
        .log-file { background: #1a1a3a; border-left: 3px solid #a371f7; color: #d2a8ff; }
        .log-info { background: #1a2a3a; border-left: 3px solid #58a6ff; color: #79c0ff; }
        .log-warning { background: #3a2a1a; border-left: 3px solid #d29922; color: #e3b341; }
        .log-error { background: #3a1a1a; border-left: 3px solid #f85149; color: #ff7b72; }
        .timestamp { color: #8b949e; margin-right: 8px; font-variant-numeric: tabular-nums; }
        .tag { font-weight: bold; color: #ffa657; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Status Panel -->
        <div class="status-panel">
            <div class="status-item">
                <div class="status-label">NFC</div>
                <div class="status-value empty" id="nfcStatus">No tag detected</div>
            </div>
            <div class="status-item">
                <div class="status-label">LUX</div>
                <div class="status-value" id="luxStatus">-- lx</div>
            </div>
            <div class="status-item">
                <div class="status-label">FILES</div>
                <div class="status-value denied" id="fileStatus">Permission denied</div>
            </div>
        </div>

        <!-- Middle Action Buttons -->
        <div class="action-panel">
            <button class="action-btn create" onclick="createFile()">Create File</button>
            <button class="action-btn delete" onclick="deleteFile()">Delete File</button>
        </div>

        <!-- Bottom Log Panel -->
        <div class="log-panel">
            <div class="log-header">
                <span class="log-title">Logs</span>
                <div class="log-controls">
                    <button class="log-btn" onclick="clearLogs()">Clear</button>
                    <button class="log-btn" onclick="toggleFilter()" id="filterBtn">Show: All</button>
                </div>
            </div>
            <div class="log-area" id="logArea">
                <div class="log-entry log-info">
                    <span class="timestamp">[init]</span> App started. Waiting for events...
                </div>
            </div>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('logArea');
        const nfcStatus = document.getElementById('nfcStatus');
        const luxStatus = document.getElementById('luxStatus');
        const fileStatus = document.getElementById('fileStatus');
        const filterBtn = document.getElementById('filterBtn');
        let entryNum = 0;
        let showAllLogs = true;

        function log(message, type = 'info') {
            if (!showAllLogs) {
                const isFileLog = type === 'file' || type === 'info' || type === 'error' || type === 'warning';
                if (!isFileLog) return;
            }

            entryNum++;
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString() + '.' + String(Date.now() % 1000).padStart(3, '0');
            entry.innerHTML = `<span class="timestamp">[${time}]</span> <span class="tag">[${type.toUpperCase()}]</span> ${escapeHtml(message)}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function toggleFilter() {
            showAllLogs = !showAllLogs;
            filterBtn.textContent = showAllLogs ? 'Show: All' : 'Show: Files Only';

            const entries = logArea.querySelectorAll('.log-entry');
            entries.forEach(entry => {
                const type = entry.className.replace('log-entry log-', '');
                const isFileLog = type === 'file' || type === 'info' || type === 'error' || type === 'warning';
                entry.style.display = (showAllLogs || isFileLog) ? '' : 'none';
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogs() {
            logArea.innerHTML = '';
            entryNum = 0;
        }

        // Update status indicators
        function updateNfcStatus(content) {
            if (content && content !== 'No tag detected') {
                nfcStatus.textContent = content;
                nfcStatus.className = 'status-value active';
            } else {
                nfcStatus.textContent = 'No tag detected';
                nfcStatus.className = 'status-value empty';
            }
        }

        function updateLuxStatus(lux) {
            luxStatus.textContent = lux.toFixed(1) + ' lx';
        }

        function updateFileStatus(granted) {
            if (granted) {
                fileStatus.textContent = 'Permission granted';
                fileStatus.className = 'status-value granted';
            } else {
                fileStatus.textContent = 'Permission denied';
                fileStatus.className = 'status-value denied';
            }
        }

        // NFC Listener
        function setupNfcListener() {
            const plugin = window.Capacitor?.Plugins?.EvilSpinsNfc;
            if (!plugin) {
                log('EvilSpinsNfc plugin not available', 'error');
                return;
            }

            plugin.isSupported().then(r => log('NFC Supported: ' + r.supported, 'info'));
            plugin.isEnabled().then(r => log('NFC Enabled: ' + r.enabled, 'info'));

            if (plugin.addListener) {
                plugin.addListener('nfcEvent', (event) => {
                    if (!event) return;

                    const eventType = event.event || 'unknown';

                    if (eventType === 'log') {
                        log(event.message, event.type);
                    } else if (eventType === 'tag_detected') {
                        log('Tag detected: ' + event.tagId, 'nfc');
                        if (event.ndefRecords && event.ndefRecords.length > 0) {
                            const payloads = event.ndefRecords.map(r => r.payload).filter(p => p && p !== '');
                            if (payloads.length > 0) {
                                updateNfcStatus(payloads.join('\n---\n'));
                            }
                            log('NDEF: ' + JSON.stringify(event.ndefRecords), 'nfc');
                        } else {
                            updateNfcStatus('Tag ID: ' + event.tagId);
                        }
                    } else if (eventType === 'tag_lost' || eventType === 'tag_removed') {
                        log('Tag removed: ' + event.tagId, 'nfc');
                        updateNfcStatus('No tag detected');
                    } else {
                        log('NFC event: ' + JSON.stringify(event), 'nfc');
                    }
                });
            }

            plugin.startListening().then(() => {
                log('NFC listening started', 'info');
            }).catch(e => log('NFC start error: ' + e.message, 'error'));
        }

        // Light Sensor Listener
        function setupLightSensorListener() {
            const plugin = window.Capacitor?.Plugins?.EvilSpinsLightSensor;
            if (!plugin) {
                log('EvilSpinsLightSensor plugin not available', 'error');
                return;
            }

            if (plugin.addListener) {
                plugin.addListener('lightSensorEvent', (event) => {
                    if (!event) return;
                    const eventType = event.event || 'unknown';
                    if (eventType === 'log') {
                        log(event.message, event.type);
                        if (event.type === 'lux') {
                            const match = event.message.match(/LUX:\s*([\d.]+)/);
                            if (match) {
                                updateLuxStatus(parseFloat(match[1]));
                            }
                        }
                    }
                });
            }
        }

        // File Storage Listener
        function setupFileStorageListener() {
            const plugin = window.Capacitor.Plugins.EvilSpinsFileStorage;
            if (!plugin) {
                log('EvilSpinsFileStorage plugin not available', 'error');
                return;
            }

            plugin.addListener('fileStorageEvent', (event) => {
                if (!event) return;
                const eventType = event.event || 'unknown';
                if (eventType === 'log') {
                    log(event.message, event.type === 'info' ? 'file' : event.type);
                    // Check for permission status in log messages
                    if (event.message.includes('MANAGE_EXTERNAL_STORAGE: GRANTED') ||
                        event.message.includes('WRITE_EXTERNAL_STORAGE: GRANTED') ||
                        event.message.includes('hasManageStoragePermission: true')) {
                        updateFileStatus(true);
                    } else if (event.message.includes('MANAGE_EXTERNAL_STORAGE: NOT GRANTED') ||
                               event.message.includes('WRITE_EXTERNAL_STORAGE: NOT GRANTED') ||
                               event.message.includes('hasManageStoragePermission: false') ||
                               event.message.includes('hasWriteExternalStoragePermission: false')) {
                        updateFileStatus(false);
                    }
                }
            });

            log('FileStorage listener ready', 'file');
        }

        // File Actions
        function createFile() {
            const plugin = window.Capacitor.Plugins.EvilSpinsFileStorage;
            if (!plugin) { log('Plugin not available', 'error'); return; }

            const fileName = 'evilspins_' + Date.now() + '.txt';
            const content = 'Created: ' + new Date().toISOString() + '\nFrom evilspins app';

            log('Creating file: ' + fileName, 'file');
            plugin.writeFile({ fileName, content, directory: '' })
                .then(result => {
                    log('Created: ' + result.path + ' (' + result.size + ' bytes)', 'file');
                    lastCreatedFile = fileName;
                })
                .catch(e => log('Create error: ' + e.message, 'error'));
        }

        function deleteFile() {
            const plugin = window.Capacitor.Plugins.EvilSpinsFileStorage;
            if (!plugin) { log('Plugin not available', 'error'); return; }

            if (!lastCreatedFile) {
                log('No file to delete (create one first)', 'warning');
                return;
            }

            log('Deleting file: ' + lastCreatedFile, 'file');
            plugin.deleteFile({ fileName: lastCreatedFile, directory: '' })
                .then(result => {
                    log('Deleted: ' + result.path, 'file');
                    lastCreatedFile = null;
                })
                .catch(e => log('Delete error: ' + e.message, 'error'));
        }

        let lastCreatedFile = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupNfcListener();
            setupLightSensorListener();
            setupFileStorageListener();
        });
    </script>
    <script src="cordova.js"></script>
    <script src="capacitor.js"></script>
</body>
</html>
